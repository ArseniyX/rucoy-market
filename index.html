<html lang="en">
<head>
<meta charset="utf-8">

<title>Rucoy Market Prices</title>
<style>
:root {
  color-scheme: light;
  --page: #f5f4f1; --surface: #fcfcfb; --border: #e4e2dc;
  --text: #0b0b0b; --text-2: #52514e; --muted: #8a8984;
  --accent: #2a78d6; --accent-soft: #cde2fb; --grid: #ebe9e3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #121211; --surface: #1a1a19; --border: #2e2e2b;
    --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8e86;
    --accent: #3987e5; --accent-soft: #1c3a5e; --grid: #2a2a27;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #121211; --surface: #1a1a19; --border: #2e2e2b;
  --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8e86;
  --accent: #3987e5; --accent-soft: #1c3a5e; --grid: #2a2a27;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 24px; margin-bottom: 16px; }
h1 { font-size: 22px; margin: 0; }
.sub { color: var(--text-2); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.tile .n { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .l { color: var(--text-2); font-size: 12px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
.tabs a { padding: 9px 14px; color: var(--text-2); text-decoration: none; font-weight: 500;
  border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a.active { color: var(--text); border-bottom-color: var(--accent); }
.note { color: var(--text-2); font-size: 12px; margin: 0 0 12px; }
.search { position: sticky; top: 0; z-index: 5; background: var(--page); padding: 8px 0 12px; }
.search input { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text); outline: none; }
.search input:focus { border-color: var(--accent); }
.hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 16px 6px; margin-bottom: 14px; }
.card h2 { font-size: 16px; margin: 0 0 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.card h2 .c { color: var(--text-2); font-weight: 400; font-size: 13px; }
.variant { display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 6px 16px;
  padding: 10px 0; border-top: 1px solid var(--grid); }
.variant:first-of-type { border-top: 0; }
.vlabel .s { font-weight: 600; }
td .rar { margin: 0; }
.rar { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--text-2);
  margin-bottom: 2px; }
.rar i { width: 10px; height: 10px; border-radius: 3px; border: 1px solid rgba(0, 0, 0, .35); display: inline-block; }
.vlabel .k { color: var(--text-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.prices { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-bottom: 4px; }
.chip { font-variant-numeric: tabular-nums; padding: 1px 7px; border-radius: 6px; background: var(--page);
  border: 1px solid var(--border); font-size: 13px; cursor: default; }
.chip.min { border-color: var(--accent); }
.strip { position: relative; height: 34px; margin: 0 8px; }
.strip .axis { position: absolute; left: 0; right: 0; top: 11px; height: 1px; background: var(--grid); }
.strip .tick { position: absolute; top: 20px; transform: translateX(-50%); color: var(--muted); font-size: 10px;
  white-space: nowrap; font-variant-numeric: tabular-nums; }
.strip .med { position: absolute; top: 3px; width: 2px; height: 17px; margin-left: -1px; background: var(--text); }
.strip .hit { position: absolute; top: 0; width: 24px; height: 24px; margin-left: -12px; cursor: pointer; }
.strip .dot { position: absolute; left: 6px; top: 6px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 2px var(--surface); }
table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 12px; border-top: 1px solid var(--grid); }
th { color: var(--text-2); font-weight: 500; font-size: 12px; cursor: pointer; user-select: none; border-top: 0; }
th.num, td.num { text-align: right; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--page); }
.seller { user-select: all; -webkit-user-select: all; cursor: copy; border-bottom: 1px dashed var(--muted); }
.seller:hover { color: var(--accent); border-bottom-color: var(--accent); }
.chip { cursor: copy; }
.icon { width: 30px; height: 30px; image-rendering: pixelated; border-radius: 6px; vertical-align: middle;
  flex: none; object-fit: cover; }
.icon.big { width: 44px; height: 44px; }
.icon.none { display: inline-block; background: var(--grid); opacity: .5; }
.namecell { display: flex; align-items: center; gap: 10px; }
.vrow { display: flex; gap: 10px; align-items: flex-start; }
.hdrpic { height: 18px; max-width: 100%; object-fit: contain; object-position: left; image-rendering: pixelated;
  border-radius: 3px; vertical-align: middle; display: block; margin-top: 3px; }
.sl { margin-top: 6px; }
.sl summary { cursor: pointer; color: var(--text-2); font-size: 12px; }
.age { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; margin-left: 6px; white-space: nowrap; }
.srow { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 5px 0;
  border-top: 1px solid var(--grid); font-size: 13px; }
.srow .sp { font-variant-numeric: tabular-nums; text-align: right; }
.srow .hdrpic { grid-column: 2 / span 2; margin: 0; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--surface);
  padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; }
#toast.on { opacity: 1; }
#tip { position: fixed; pointer-events: none; background: var(--text); color: var(--surface); padding: 6px 9px;
  border-radius: 7px; font-size: 12px; white-space: nowrap; display: none; z-index: 20; }
.empty { color: var(--text-2); padding: 24px 0; }
@media (max-width: 640px) {
  .variant { grid-template-columns: 1fr; }
  .hide-sm { display: none; }
}
</style>
</head>

const L = DATA.listings;

// how long ago a listing was scanned: "12m", "3h", "2d"
const ago = t => { const m = Math.max(0, (Date.now() - new Date(t)) / 6e4);
  return m < 60 ? `${Math.round(m)}m` : m < 1440 ? `${Math.round(m / 60)}h` : `${Math.round(m / 1440)}d`; };
const kk = p => p >= 1e6 ? `${+(p / 1e6).toFixed(2)}kk` : p >= 1e3 ? `${+(p / 1e3).toFixed(1)}k` : `${p}`;
const median = a => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
// item icon, per item + rarity (the slot colour shows the rarity, so never borrow another
// rarity's icon for a rarity line; an empty placeholder keeps rows aligned until it's scanned)
const ICONS = DATA.meta.icons || {};
function iconTag(item, rarity, cls = "") {
  const src = ICONS[item + "|" + rarity];
  return src ? `<img class="icon ${cls}" src="${esc(src)}" alt="" loading="lazy">` : `<span class="icon ${cls} none"></span>`;
}
function anyIcon(item, cls) {      // the item itself (card title): any rarity will do
  const src = Object.entries(ICONS).find(([k]) => k.startsWith(item + "|"))?.[1];
  return src ? `<img class="icon ${cls}" src="${esc(src)}" alt="" loading="lazy">` : "";
}
// picture of the name as the game drew it (OCR can swap I/l, case) -- item detail view only
const PICS = DATA.meta.pics || {};
const picTag = name => PICS[name] ? `<img class="hdrpic" src="${esc(PICS[name])}" alt="${esc(name)} as shown in game" loading="lazy">` : "";
// seller names: one click copies (also selectable by hand)
const sellerTag = name => `<span class="seller" data-copy="${esc(name)}">${esc(name)}</span>`;
const toast = document.getElementById("toast");
function copyText(t) {
  const done = () => { toast.textContent = `Copied “${t}”`; toast.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => toast.classList.remove("on"), 1400); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, () => fallback(t) && done());
  else if (fallback(t)) done();
}
function fallback(t) {
  const ta = Object.assign(document.createElement("textarea"), {value: t});
  ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
  const ok = document.execCommand("copy"); ta.remove(); return ok;
}
document.addEventListener("click", e => {
  const c = e.target.closest("[data-copy]");
  if (!c) return;
  e.stopPropagation();        // don't also open the row
  copyText(c.dataset.copy);
}, true);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

// group: item -> stats -> listings
// rarity = in-game name colour (swatch shows the game's own colour)
const RAR = {Common: "#f3f3f3", Uncommon: "#00ea4e", Rare: "#3cbcfc", Epic: "#e977fc", Legendary: "#eaff00", Mythic: "#ffbb00"};
const items = new Map();
for (const r of L) {
  if (!items.has(r.item)) items.set(r.item, new Map());
  const v = items.get(r.item), key = r.tier + "|" + r.stats;
  if (!v.has(key)) v.set(key, []);
  v.get(key).push(r);
}

document.getElementById("asof").textContent = `latest scan ${DATA.meta.latest}`;
document.getElementById("tiles").innerHTML = [
  [L.length, "listings"], [items.size, "different items"], [DATA.meta.sellers, "sellers"],
].map(([n, l]) => `<div class="tile"><div class="n">${n.toLocaleString()}</div><div class="l">${l}</div></div>`).join("");

const tip = document.getElementById("tip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest("[data-tip]");
  if (!t) { tip.style.display = "none"; return; }
  tip.textContent = t.dataset.tip;
  tip.style.display = "block";
  tip.style.left = tip.style.top = "0px";      // measure at full width, not squeezed by the edge
  const w = tip.offsetWidth, h = tip.offsetHeight, vw = document.documentElement.clientWidth;
  tip.style.left = Math.max(8, Math.min(e.clientX + 12, vw - w - 8)) + "px";
  tip.style.top = (e.clientY + 14 + h > innerHeight - 8 ? e.clientY - h - 10 : e.clientY + 14) + "px";
});

// dot strip on a log price scale shared by all variants of one item
function strip(rows, lo, hi) {
  const x = p => hi === lo ? 50 : (Math.log(p) - Math.log(lo)) / (Math.log(hi) - Math.log(lo)) * 100;
  const ticks = [lo, Math.sqrt(lo * hi), hi].filter((v, i, a) => i === 0 || v > a[i - 1] * 1.3);
  const med = median(rows.map(r => r.price));
  let s = `<div class="strip" role="img" aria-label="price spread"><div class="axis"></div>`;
  for (const t of ticks) s += `<span class="tick" style="left:${x(t)}%">${kk(Math.round(t))}</span>`;
  s += `<div class="med" style="left:${x(med)}%" data-tip="median ${kk(med)}"></div>`;
  for (const r of rows)
    s += `<div class="hit" style="left:${x(r.price)}%" data-tip="${esc(kk(r.price) + " · " + r.seller + " · " + ago(r.time))}" data-copy="${esc(r.seller)}"><div class="dot"></div></div>`;
  return s + "</div>";
}

function card(name) {
  const variants = [...items.get(name).values()]
    .map(rows => [rows[0].stats, [...rows].sort((a, b) => a.price - b.price)])
    .sort((a, b) => a[1][0].tier - b[1][0].tier || a[1][0].price - b[1][0].price);
  const all = variants.flatMap(v => v[1].map(r => r.price));
  const lo = Math.min(...all), hi = Math.max(...all);
  const n = all.length;
  let h = `<div class="card"><h2>${anyIcon(name, "big")}${esc(name)}<span class="c">${n} listed · ${variants.length} ${variants.length > 1 ? "rarities" : "rarity"}</span></h2>`;
  for (const [stats, rows] of variants) {
    const p = rows.map(r => r.price);
    const lvl = rows[0].level ? `Lv ${esc(rows[0].level)} · ` : "";
    const rar = rows[0].rarity ? `<div class="rar"><i style="background:${RAR[rows[0].rarity]}"></i>${rows[0].rarity}</div>` : "";
    h += `<div class="variant"><div class="vrow">${iconTag(name, rows[0].rarity)}<div class="vlabel">${rar}<div class="s">${esc(stats || "no stats")}</div>`
       + `<div class="k">${lvl}${p.length} listed · cheapest ${kk(p[0])} · median ${kk(median(p))}</div>`
       + `</div></div>`
       + `<div><div class="prices">${rows.map((r, i) => `<span class="chip${i ? "" : " min"}" data-tip="${esc(r.seller + " · " + ago(r.time))}" data-copy="${esc(r.seller)}">${kk(r.price)}</span>`).join("")}</div>`
       + strip(rows, lo, hi)
       + `<details class="sl"><summary>Sellers (${rows.length})</summary>`
       + rows.map(r => `<div class="srow"><span class="sp">${kk(r.price)}</span><span>${sellerTag(r.seller)}</span><span class="age" title="${esc(r.time.replace("T", " "))}">${ago(r.time)}</span>${picTag(r.seller)}</div>`).join("")
       + `</details></div></div>`;
  }
  return h + "</div>";
}

let sortKey = "name", sortDir = 1;
function overview() {
  // one row per item + rarity
  const groups = new Map();
  for (const [name, v] of items)
    for (const rows of v.values()) {
      const key = name + "|" + rows[0].tier;
      if (!groups.has(key)) groups.set(key, {name, tier: rows[0].tier, rarity: rows[0].rarity, p: []});
      const g = groups.get(key);
      g.p.push(...rows.map(r => r.price));
    }
  const rows = [...groups.values()].map(g =>
    ({name: g.name, tier: g.tier, rarity: g.rarity, n: g.p.length, min: Math.min(...g.p), med: median(g.p)}));
  const cmp = (a, b, k) => a[k] > b[k] ? 1 : a[k] < b[k] ? -1 : 0;
  rows.sort((a, b) => (cmp(a, b, sortKey) * sortDir) || cmp(a, b, "name") || cmp(a, b, "tier"));
  const th = (k, l, num, cls = "") => `<th class="${num ? "num" : ""} ${cls}" data-k="${k}">${l}${sortKey === k ? (sortDir > 0 ? " ▲" : " ▼") : ""}</th>`;
  const badge = r => r.rarity ? `<span class="rar"><i style="background:${RAR[r.rarity]}"></i>${r.rarity}</span>` : `<span class="rar">–</span>`;
  return `<table><thead><tr>${th("name", "Item")}${th("tier", "Rarity")}${th("n", "Listed", 1)}${th("min", "Cheapest", 1)}${th("med", "Median", 1, "hide-sm")}</tr></thead><tbody>`
    + rows.map(r => `<tr data-item="${esc(r.name)}"><td><span class="namecell">${iconTag(r.name, r.rarity)}${esc(r.name)}</span></td><td>${badge(r)}</td><td class="num">${r.n}</td><td class="num">${kk(r.min)}</td><td class="num hide-sm">${kk(r.med)}</td></tr>`).join("")
    + "</tbody></table>";
}

// resell deals: buy the cheapest listing of a variant, resell just under the next cheapest
const MIN_MARGIN = 0.15;
const DEALS = [];
for (const [name, v] of items)
  for (const rows of v.values()) {
    if (rows.length < 2) continue;
    const s = [...rows].sort((a, b) => a.price - b.price);
    const buy = s[0], next = s[1].price;
    if (next < buy.price * (1 + MIN_MARGIN)) continue;
    DEALS.push({name, tier: buy.tier, rarity: buy.rarity, stats: buy.stats, seller: buy.seller, time: buy.time, buy: buy.price,
                next, profit: next - buy.price, margin: next / buy.price - 1, n: rows.length});
  }
const SHOW_DEALS = DATA.meta.deals !== false;
if (SHOW_DEALS) document.getElementById("tab-deals").textContent = `Resell deals (${DEALS.length})`;
else document.querySelector("nav.tabs").remove();      // public site: prices only

let dSortKey = "profit", dSortDir = -1;
function dealsPage() {
  const cmp = (a, b, k) => a[k] > b[k] ? 1 : a[k] < b[k] ? -1 : 0;
  const rows = [...DEALS].sort((a, b) => (cmp(a, b, dSortKey) * dSortDir) || -cmp(a, b, "profit"));
  const th = (k, l, num, cls = "") => `<th class="${num ? "num" : ""} ${cls}" data-dk="${k}">${l}${dSortKey === k ? (dSortDir > 0 ? " ▲" : " ▼") : ""}</th>`;
  const badge = r => r.rarity ? `<span class="rar"><i style="background:${RAR[r.rarity]}"></i>${r.rarity}</span>` : `<span class="rar">–</span>`;
  const note = `<p class="note">Same item, rarity and stats where the next cheapest listing is at least ${MIN_MARGIN * 100}% above the cheapest. `
    + `Profit = next cheapest − cheapest (before undercutting). "2" listed = less sure: the other one may just be overpriced. `
    + `Check the price in game before buying: a misread price shows up here too. Click a row for all prices of that item.</p>`;
  if (!rows.length) return note + `<div class="empty">No deals in this scan.</div>`;
  return note + `<table><thead><tr>${th("name", "Item")}${th("tier", "Rarity")}${th("stats", "Stats", 0, "hide-sm")}${th("seller", "Buy from", 0, "hide-sm")}`
    + `${th("buy", "Buy", 1)}${th("next", "Next", 1, "hide-sm")}${th("profit", "Profit", 1)}${th("margin", "Margin", 1)}${th("n", "Listed", 1, "hide-sm")}</tr></thead><tbody>`
    + rows.map(r => `<tr data-item="${esc(r.name)}"><td><span class="namecell">${iconTag(r.name, r.rarity)}${esc(r.name)}</span></td><td>${badge(r)}</td><td class="hide-sm">${esc(r.stats || "–")}</td>`
      + `<td class="hide-sm">${sellerTag(r.seller)}<span class="age" title="${esc(r.time.replace("T", " "))}">${ago(r.time)}</span></td><td class="num">${kk(r.buy)}</td><td class="num hide-sm">${kk(r.next)}</td>`
      + `<td class="num"><b>+${kk(r.profit)}</b></td><td class="num">+${Math.round(r.margin * 100)}%</td><td class="num hide-sm">${r.n}</td></tr>`).join("")
    + "</tbody></table>";
}

const q = document.getElementById("q"), out = document.getElementById("out");
const pricesEl = document.getElementById("pricesPage"), dealsEl = document.getElementById("dealsPage");
function render() {
  const onDeals = SHOW_DEALS && location.hash === "#deals";
  pricesEl.hidden = onDeals;
  dealsEl.hidden = !onDeals;
  document.getElementById("tab-deals")?.classList.toggle("active", onDeals);
  document.getElementById("tab-prices")?.classList.toggle("active", !onDeals);
  if (onDeals) { dealsEl.innerHTML = dealsPage(); return; }
  const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) { out.innerHTML = overview(); return; }
  const hits = [...items.keys()].filter(n => words.every(w => n.toLowerCase().includes(w))).sort();
  out.innerHTML = hits.length ? hits.slice(0, 60).map(card).join("")
    : `<div class="empty">No listings match “${esc(q.value)}”.</div>`;
}
// the search lives in the URL (#q=...) so Back/Forward step through lookups
const fromHash = () => decodeURIComponent((location.hash.match(/^#q=(.*)$/) || [, ""])[1]);
const toHash = v => v ? "#q=" + encodeURIComponent(v) : location.pathname;
let typing, typedStep = false;   // typedStep: current history entry came from typing
q.addEventListener("input", () => {
  render();
  clearTimeout(typing);   // one history step per search, not per keystroke
  typing = setTimeout(() => {
    history[typedStep ? "replaceState" : "pushState"](null, "", toHash(q.value));
    typedStep = true;
  }, 600);
});
addEventListener("popstate", () => { typedStep = false; q.value = fromHash(); render(); });
dealsEl.addEventListener("click", e => {
  const th = e.target.closest("th[data-dk]");
  if (th) { const k = th.dataset.dk; dSortDir = dSortKey === k ? -dSortDir : (["name", "tier", "stats", "seller"].includes(k) ? 1 : -1); dSortKey = k; render(); return; }
  const tr = e.target.closest("tr[data-item]");
  if (tr) { typedStep = false; q.value = tr.dataset.item; history.pushState(null, "", toHash(q.value)); render(); scrollTo(0, 0); }
});
out.addEventListener("click", e => {
  const th = e.target.closest("th[data-k]");
  if (th) { const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : (k === "name" || k === "tier" ? 1 : -1); sortKey = k; render(); return; }
  const tr = e.target.closest("tr[data-item]");
  if (tr) { typedStep = false; q.value = tr.dataset.item; history.pushState(null, "", toHash(q.value)); render(); scrollTo(0, 0); }
});
q.value = fromHash();
render();
</script>
